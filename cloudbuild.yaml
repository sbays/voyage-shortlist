# Runs on every push to main, through the trigger created by
# `scripts/gcp-setup.sh trigger`. Checks first, then builds the image into
# Artifact Registry and deploys it to Cloud Run.

substitutions:
  _REGION: europe-west2
  _REPO: voyage-shortlist
  _SERVICE: voyage-shortlist
  _RUNTIME_SA: voyage-web@${PROJECT_ID}.iam.gserviceaccount.com

options:
  # Required when the trigger runs as a user-managed service account.
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:
  - id: checks
    name: node:24-slim
    entrypoint: bash
    env:
      - NEXT_TELEMETRY_DISABLED=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    args:
      - -euo
      - pipefail
      - -c
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm verify

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}
      - --service-account=${_RUNTIME_SA}
      - --min-instances=0
      - --max-instances=2
      # Public access is granted once by `scripts/gcp-setup.sh public`, so this
      # build account only needs run.developer, not run.admin. Redeploys keep
      # the binding, but deleting and recreating the service loses it: the
      # next step warns when that has happened.

  - id: check-public
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if gcloud run services get-iam-policy ${_SERVICE} --project=${PROJECT_ID} \
            --region=${_REGION} --format='value(bindings.members)' | grep -q allUsers; then
          echo "Service is public."
        else
          echo "WARNING: ${_SERVICE} is not public, so visitors get 403."
          echo "WARNING: run: bash scripts/gcp-setup.sh public"
        fi

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}
